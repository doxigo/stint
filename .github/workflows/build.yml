name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checks
        run: ./check.sh
      - name: Build
        run: swift build -c release

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          umask 077
          : "${CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_PASSWORD:?Missing APPLE_APP_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          keychain="$RUNNER_TEMP/teamwork-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ {print $2; exit}')
          test -n "$identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=TeamworkTimer" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials TeamworkTimer --keychain "$keychain" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Version from tag
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Info.plist
      - name: Sign and notarize
        run: ./bundle.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/TeamworkTimer.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Clean signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/teamwork-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/teamwork-signing.keychain-db"
          fi
